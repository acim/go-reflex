# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'daily'
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'daily'
    # Go's Docker tags spell release candidates as, for example,
    # 1.27rc2-alpine. Dependabot currently treats these as newer stable tags.
    # Keep patch automation, but handle stable Go minor/major upgrades manually
    # so prereleases never enter CI.
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
